/* Layout: colonna da telefono, adesivi inclinati, bordi spessi e ombre piene; barra a 4 pulsanti colorati in basso. */

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

*{box-sizing:border-box}

.panel{background:var(--surface);border:var(--bw) solid var(--bc);border-radius:calc(var(--rk) * 18px);box-shadow:var(--so) var(--so) 0 var(--shadow);padding:14px;margin-bottom:18px}

.fcs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fc{display:grid;gap:4px;align-content:start;font-weight:700;font-size:14px}.fc b{display:flex;align-items:center;gap:6px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}.fc b i{width:12px;height:12px;border-radius:50%;background:var(--c);border:var(--bw) solid var(--bc);flex:none}

  ]}

function shareText(){
  var c=D.cur||{},t=S.tab,L=[],nm=function(ids){return (ids||[]).map(pname).join(', ')||'—'},st=stats(),ids=allIds();
  function topList(key,u){return ids.filter(function(id){return st[id][key]>0}).sort(function(x,y){return st[y][key]-st[x][key]}).slice(0,5).map(function(id,i){return (i+1)+'. '+pname(id)+' '+st[id][key]+(u?' '+u:'')})}
  function head(){return fmtName(c)+' · '+dLabel(c.date)+(c.time?', ore '+c.time:'')+(c.field?', '+c.field:'')}
  if(t==='partita'){
    L.push('⚽ '+head());
    L.push((c.official&&c.official.length?'Formazione ufficiale ':'In formazione ')+lineup().length+'/'+need()+':');
    lineup().forEach(function(id){L.push('• '+pname(id))});
    var q=queueIds();if(q.length)L.push('In coda: '+nm(q));
    var mb=ids.filter(function(id){return rsvpOf(id)==='maybe'});if(mb.length)L.push('Forse: '+nm(mb));
    var mi=ids.filter(function(id){return !rsvpOf(id)});if(mi.length)L.push('Senza risposta: '+nm(mi));
  }else if(t==='squadre'||(t==='risultato'&&c.status!=='closed')){
    L.push('⚽ '+head());
    if(teamsReady()){L.push(tn(c,'A')+': '+nm(c.teamA));L.push(tn(c,'B')+': '+nm(c.teamB))}
    else{L.push('Squadre non ancora fatte. In formazione: '+nm(lineup()))}
  }else if(t==='risultato'){
    L.push('⚽ '+tn(c,'A')+' '+(c.sa||0)+' – '+(c.sb||0)+' '+tn(c,'B')+' · '+dShort(c.date));
    var h0=D.history.filter(function(x){return x._id===c.id})[0]||{};
    var gl=Object.keys(h0.goals||{}).filter(function(k){return h0.goals[k]>0}).map(function(k){return pname(k)+' '+h0.goals[k]});
    if(gl.length)L.push('Marcatori: '+gl.join(', '));
    var as=Object.keys(h0.assists||{}).filter(function(k){return h0.assists[k]>0}).map(function(k){return pname(k)+' '+h0.assists[k]});
    if(as.length)L.push('Assist: '+as.join(', '));
    if(c.mvp)L.push('👑 MVP: '+pname(c.mvp));
  }else if(t==='pagella'){
    var sub=S.sub||'premi',map={marcatori:['g','gol'],assist:['a','assist'],mvp:['mvp','MVP'],presenze:['pl','partite'],forfait:['fg','forfait']};
    L.push('📊 Pagella · '+np(D.history.length,'partita giocata','partite giocate'));
    if(map[sub]){L.push(({marcatori:'Marcatori',assist:'Assist',mvp:'MVP',presenze:'Presenze',forfait:'Forfait'})[sub]+':');topList(map[sub][0],map[sub][1]).forEach(function(x){L.push(x)})}
    else if(sub==='media'){L.push('Media gol a partita:');ids.filter(function(id){return st[id].pl>0}).map(function(id){return [id,st[id].g/st[id].pl]}).sort(function(x,y){return y[1]-x[1]}).slice(0,5).forEach(function(x,i){L.push((i+1)+'. '+pname(x[0])+' '+x[1].toFixed(1))})}
    else if(sub==='premi'){awardsList().forEach(function(x){L.push(x.l+': '+x.n+' ('+x.d+')')})}
    else if(sub==='albo'){D.history.slice(0,5).forEach(function(m){L.push(dShort(m.date)+' · '+tn(m,'A')+' '+(m.sa||0)+'–'+(m.sb||0)+' '+tn(m,'B'))})}
    else{[['Capocannoniere','g','gol'],['MVP','mvp','premi'],['Più presente','pl','partite']].forEach(function(r){var b=topList(r[1],r[2])[0];if(b)L.push(r[0]+': '+b.replace(/^1\. /,''))})}
  }else{
    var m=me();L.push('🏅 '+(m?m.nick:'Il mio profilo')+(m&&m.aka?' “'+m.aka+'”':'')+(m&&m.roles?' · '+m.roles.join(' · '):''));
    if(m){var T=trophyData(UID);L.push('Trofei: '+T.reduce(function(n,x){return n+x.lv},0)+' di '+T.length*5)}
  }
  if(L.length<2&&t==='pagella')L.push('Ancora nessuna partita.');
  L.push('— Forfait, il calcetto del martedì');
  return L.join('\n');
}

function awardsList(){
  var st=stats(),ex=extra(),ids=allIds(),out=[];
  function best(f,min){var b=null,bv=-1;ids.forEach(function(id){var v=f(id);if(v>=min&&v>bv){bv=v;b=id}});return b?{id:b,v:bv}:null}
  var x;
  if(x=best(function(id){return st[id].g},1))out.push({l:'Capocannoniere',n:pname(x.id),d:x.v+' gol'});
  if(x=best(function(id){return st[id].a},1))out.push({l:'Re degli assist',n:pname(x.id),d:np(x.v,'assist','assist')});
  if(x=best(function(id){return st[id].mvp},1))out.push({l:'MVP della stagione',n:pname(x.id),d:np(x.v,'premio','premi')});
  if(x=best(function(id){return st[id].pl},1))out.push({l:'Più presente',n:pname(x.id),d:np(x.v,'partita','partite')});
  if(x=best(function(id){return ex.wins[id]||0},1))out.push({l:'Più vittorie',n:pname(x.id),d:np(x.v,'vittoria','vittorie')});
  if(x=best(function(id){return st[id].pl>=2?st[id].g/st[id].pl:0},0.01))out.push({l:'Miglior media gol',n:pname(x.id),d:x.v.toFixed(1)+' a partita'});
  if(x=best(function(id){return ex.streak[id]},2))out.push({l:'Serie in corso',n:pname(x.id),d:x.v+' partite di fila'});
  var pr=ex.pairs.filter(function(p){return p.n>=2}).sort(function(a,b){return b.pts/b.n-a.pts/a.n||b.n-a.n})[0];
  if(pr)out.push({l:'Coppia d\'oro',n:pname(pr.a)+' + '+pname(pr.b),d:pr.w+' vittorie su '+pr.n});
  if(x=best(function(id){return st[id].fg},1))out.push({l:'Re dei forfait',n:pname(x.id),d:np(x.v,'forfait','forfait')});
  return out;
}

function playerLog(){
  var L={};allIds().forEach(function(id){if(!isG(id))L[id]={pl:0,g:0,a:0,mvp:0,w:0,cs:0,og:0}});
  D.history.forEach(function(m){
    var sa=m.sa||0,sb=m.sb||0;
    [[m.teamA||[],sa,sb],[m.teamB||[],sb,sa]].forEach(function(t){t[0].forEach(function(id){var l=L[id];if(!l)return;l.pl++;if(t[1]>t[2])l.w++;if(t[2]===0)l.cs++})});
    Object.keys(m.goals||{}).forEach(function(id){if(L[id])L[id].g+=m.goals[id]});
    Object.keys(m.assists||{}).forEach(function(id){if(L[id])L[id].a+=m.assists[id]});
    Object.keys(m.og||{}).forEach(function(id){if(L[id])L[id].og+=m.og[id]});
    if(m.mvp&&L[m.mvp])L[m.mvp].mvp++;
  });
  return L;
}

["📒", "Il taccuino dei gol", "Nel taccuino ufficiale {n} ha {g} gol. Nella sua testa almeno il triplo, tutti bellissimi, tutti da 30 metri, tutti con commento tecnico.", "g"],
["🗿", "La statua in giardino", "{n} ha giocato {pl} partite con questo gruppo: abbastanza per meritare una statua in giardino, a grandezza naturale e in gesso. Gesso scadente, ma l'intento conta.", "pl"],
["👑", "Il re dell'MVP", "{n} ha vinto {mvp} premi MVP. Si dice che conservi ogni applauso in una scatola di latta, con un nastrino azzurro, e che la apra solo davanti allo specchio.", "mvp"],
["🪑", "Il contratto con la traversa", "Si dice che {n} abbia un contratto con la traversa: non la colpisce mai, ma la saluta ogni volta che ci passa vicino. La traversa, per educazione, ricambia."],
["🐢", "Corsa in direzione opposta", "Gli esperti confermano: {n} corre tantissimo. Peccato sia quasi sempre nella direzione opposta al pallone. Una questione di principi, dicono."],
["🌿", "La rovesciata del cespuglio", "Nel 2021 {n} tentò una rovesciata spettacolare. Il pallone finì in un cespuglio, che da allora è tifoso dichiarato. L'unico."],
["🛰️", "Il tiro in orbita", "L'ultimo tiro di {n} è finito in orbita. L'agenzia spaziale conferma: la Stazione ringrazia, ma restituirà il pallone solo a Natale."],
["🚧", "Il tunnel col cono", "{n} ha tentato un tunnel a un cono stradale. Il cono è rimasto fermo, ha vinto lui. È stata la sconfitta più dignitosa della serata."],
["🏛️", "Il museo dei gol sbagliati", "Nei sotterranei dello stadio esiste un museo dedicato ai gol sbagliati di {n}. Ha tre piani, un bar e una lunga lista d'attesa."],
["🔭", "Gli scienziati e il tiro", "Gli scienziati hanno scoperto che il tiro di {n} devia per la curvatura dello spazio-tempo. O per il vento. O per i piedi. L'ultima ipotesi è la più accreditata."],
["🪦", "Il giorno del forfait", "Il numero di forfait di {n} è così alto che il calendario ha chiesto un trasferimento. Il martedì ora si sente solo e preoccupato.", "fg"],
["📮", "Le conferme di presenza", "La conferma di presenza di {n} ha la stessa credibilità di un oroscopo: tutti la leggono, nessuno ci conta, qualcuno sorride."],
["🦖", "I reperti del 2087", "Nel 2087 un archeologo troverà il parastinchi di {n} e lo esporrà come reperto di una civiltà perduta: quella di chi non sapeva stoppare."],
["🐈", "La finta del gatto", "Una volta {n} ha fatto una finta così convincente che il gatto del vicino è caduto per terra. L'avversario, invece, non si è nemmeno accorto."],
["🎬", "Il film sulla vita di {n}", "Hollywood vorrebbe girare il film su {n}. Il titolo provvisorio è «Passaggio sbagliato». La sceneggiatura è già scritta: è la partita di martedì scorso."],
["📺", "La replica della moviola", "Alla moviola, l'azione di {n} è stata riguardata sei volte. Conclusione: era davvero un fallo. Ma contro sé stesso."],
["🧊", "Il sangue freddo", "Davanti alla porta vuota {n} è così calmo che si ferma a pensare. A pensare. Per un tempo che l'arbitro ha definito «biblico»."],
["🧂", "Il sale sulla maglia", "Nessuno sa perché {n} metta sempre un pizzico di sale nella borsa. Portafortuna? Superstizione? Tutti hanno smesso di chiedere dopo l'ultima risposta."],
["🕳️", "Il buco nel campo", "Il buco nel campo che fa inciampare tutti ha un nome: {n}. Da quando è arrivato, i buchi sono diventati due. Ne parlano anche in comune."],
["🦆", "Il tiro d'anatra", "{n} ha calciato una punizione che ha fatto un volo anomalo e ha colpito un'anatra. L'anatra ora è assunta come mascotte e si rifiuta di giocare."],
["🧯", "L'estintore del capitano", "Nelle partite decisive {n} entra con un estintore, per sicurezza. Non si sa mai: i suoi contrasti prendono fuoco di continuo."],
["🥶", "L'abbraccio del gol", "Dopo ogni gol {n} abbraccia tutti, inclusi gli avversari, l'arbitro e un passante. Il passante ora ha chiesto il tesseramento."],
["🧲", "La calamita dei pali", "{n} attira i pali come una calamita: se c'è un palo in zona, ci finisce contro. Il palo, a dire il vero, ha chiesto più volte di essere spostato."],
["⛑️", "La casco-tattica", "{n} gioca in modalità prudente: ginocchiere, parastinchi, polsini e una fascia sulla fascia. Il risultato è un guerriero invincibile. Fino al primo contrasto."],
["🎂", "Il compleanno che non finisce", "{n} festeggia il compleanno ogni martedì, a quanto pare. Torta, candeline, auguri. L'età invece non cambia mai. Misteri della scienza."],
["🚑", "Il dolorino strategico", "Ogni volta che la partita si fa dura, a {n} viene un dolorino alla caviglia. Che passa magicamente al fischio finale. Fenomeno studiato da tre università."],
["🔕", "Il telefono in campo", "Durante la partita {n} controlla il telefono dieci volte. Dice che aspetta una chiamata importante. È sempre l'arbitro: «Passa la palla»."],
["🥁", "Il tamburo del gol", "Quando {n} sta per segnare, tutti sentono un tamburo in lontananza. Poi il tiro finisce in curva e il tamburo smette, deluso."],
["🎪", "Il circo del dribbling", "Il dribbling di {n} è un'attrazione da circo: il pubblico trattiene il fiato, l'avversario sbadiglia e, alla fine, il pallone torna sempre all'avversario."],
["🧃", "Il succo del terzo tempo", "Alla fine della partita {n} beve un succo di frutta con la serietà di un sommelier. «Annate buone, questo 2024». È un succo all'ananas."],
["🪄", "La magia della panchina", "Quando {n} siede in panchina la squadra gioca meglio. Gli analisti propongono di tenerlo in panchina il più possibile, con affetto."],
["🗺️", "La mappa del campo", "{n} ha una mappa del campo con le zone «sicure». Ne ha individuata una sola: fuori. Ci passa il tempo, quando può."],
["📞", "La chiamata al VAR", "{n} ha chiesto il VAR su un fallo che nessuno ha fischiato. Il VAR non esiste, ma è stato convocato lo stesso. Ha confermato il fallo: contro il VAR."],
["🧊", "La difesa a ghiaccio", "La difesa di {n} è un muro di ghiaccio: si scioglie con due palleggi e un po' di vento. In certe sere basta guardarlo male."],
["🦒", "Le gambe di {n}", "Secondo un recente studio, le gambe di {n} arrivano sempre dopo il pallone. Il pallone, sentendosi in colpa, ogni tanto aspetta."],
["🔊", "Il grido di battaglia", "Prima del calcio d'inizio {n} lancia un grido di battaglia. Gli uccelli volano via, i compagni sorridono, gli avversari prendono appunti. Poi si gioca, e l'appunto è «non temere»."],
["🐌", "La partenza a freno tirato", "{n} parte sempre molto piano, poi accelera, poi rallenta di nuovo. Il tutto in cinque secondi. Tecnicamente è una partenza a fisarmonica."],
["🎓", "Il corso di tattica", "{n} ha seguito un corso di tattica di sei mesi. Ora spiega tutto con lavagna e pennarelli. Non c'è nessuna lavagna: disegna sull'aria."],
["🏆", "La coppa immaginaria", "In camera di {n} c'è una coppa immaginaria vinta nel torneo del 2018: «Il più sportivo». Nessuno sa chi l'abbia votato. Si sospetta lo specchio."],
["🔧", "Il cacciavite del parastinchi", "{n} ripara i parastinchi con un cacciavite. Non c'è niente da riparare. Ma gli piace avere il suo attrezzo preferito pronto, per le emergenze."],
["🧩", "Il puzzle della formazione", "Ogni settimana {n} prova a incastrare la formazione perfetta. Ogni settimana il puzzle ha un pezzo in più: lui."],
["🧨", "Il tiro a effetto", "Il tiro a effetto di {n} è così effettato che torna indietro, passa per l'altro campo e colpisce un albero. Gli alberi hanno aperto una vertenza."],
["🎻", "Il violino del portiere", "Quando {n} sta in porta, la tensione è tale che si sente un violino. È l'avversario che sta ridendo con gli archetti."],
["🦉", "Il gufo dei pali", "Nel campo c'è un gufo che osserva solo {n}. Non sappiamo perché. Gli esperti dicono che aspetta di vedere se riesce a fare un gol."],
["🛒", "La spesa durante la partita", "Al fischio dell'intervallo {n} fa la lista della spesa. Compra solo cose che iniziano con la «P»: pane, pasta, pomodori, pallone. Lo ha dimenticato a casa."],
["🥾", "Gli scarpini dell'anno", "Gli scarpini di {n} sono gli stessi del 2014. Hanno visto cose che voi umani non potete immaginare. E hanno chiesto ferie."],
["🪞", "Lo specchio dello spogliatoio", "Davanti allo specchio dello spogliatoio {n} dice sempre: «Oggi è la giornata giusta». Lo specchio ha smesso di rispondere da settimane."],
["🔔", "La campanella del terzo tempo", "Quando suona la campanella del terzo tempo {n} è il primo a sedersi. Anche se la partita non è ancora finita. Anche se è il primo tempo."],
["🍳", "L'uovo del portiere", "Si dice che {n} abbia parato un tiro con un uovo in tasca, senza romperlo. L'uovo è stato intervistato: «Non ricordo nulla. Ero concentrato»."],
["🌍", "Il giro del mondo in 90 minuti", "{n} corre così tanto che, secondo il GPS, ha fatto il giro del mondo. Peccato fosse sempre in cerchio intorno al centrocampo."],
["📚", "La biblioteca della sconfitta", "In casa di {n} c'è una biblioteca di libri dedicati alle sconfitte celebri. Il volume preferito è il quinto: «Come scusarsi con eleganza»."],
["🪁", "L'aquilone del tiro", "Il pallone calciato da {n} si alza tanto che un bambino lo scambia per un aquilone. Chiede di poterci giocare anche lui, ma gli dicono «Ancora un po'»."],
["🦊", "La volpe d'area", "{n} è una vera volpe d'area di rigore: furba, silenziosa, sempre appostata. Peccato che la porta sia nell'altra area."],
["🔥", "Il fuoco del rigore", "Quando {n} calcia un rigore l'arbitro, il portiere e il pubblico si siedono. Per sicurezza. Nessuno sa mai dove andrà il pallone."],
["🎤", "Il comizio del centrocampo", "A metà partita {n} tiene un comizio sul gioco di squadra. Applausi, qualche fischio, un cameraman. Poi si torna a giocare e si scopre che il cameraman è l'unico a muoversi."],
["🧳", "Il trasferimento in estate", "Ogni estate {n} dice che si trasferisce in un'altra squadra. Ogni settembre torna con il nuovo taglio di capelli. Tutti fingono di essere sorpresi."],
["🌋", "L'eruzione del tiro", "Il tiro di {n} è stato registrato dai sismografi: magnitudo 3. Il pallone, invece, è rimasto fermo. Si indaga."],
["🍝", "La pasta dell'intervallo", "All'intervallo {n} mangia un piatto di pasta, con la serietà di un maratoneta. Nel secondo tempo gioca in modalità digestione: lentissimo e felice."],
["🎠", "La giostra dei ruoli", "Un giorno {n} gioca difensore, poi attaccante, poi portiere, poi arbitro. Nessuno capisce come faccia. Tutti sono d'accordo su un punto: non è bravo in nessuno."],
["🛠️", "La cassetta degli attrezzi", "{n} porta sempre una cassetta degli attrezzi in campo. Se serve, aggiusta il pallone. Il pallone dice di essere sano, ma accetta il controllo."],
["🎲", "Il dado della formazione", "Per scegliere la squadra {n} lancia un dado. Il dado ha sette facce. Due sono «difensore», una è «portiere», le altre sono scuse."],
["🌙", "Il tiro della luna", "Alle 22 di sera il tiro di {n} sembra più forte, grazie alla luna. Dopo le 23 è solo un tiro, e anche un po' triste."],
["🥋", "L'arte del contrasto", "{n} ha studiato arti marziali per migliorare i contrasti. Funziona: gli avversari si inchinano per rispetto. Poi gli passano di fianco."],
["💤", "Il pisolino del secondo tempo", "Nel secondo tempo {n} ha l'abitudine di chiudere gli occhi per qualche secondo. Dice che «visualizza l'azione». L'azione, nel frattempo, è finita."],
["🦄", "L'unicorno di fascia", "Si dice che {n} sia un unicorno di fascia: raro, leggendario, quasi invisibile. Gli studiosi lo cercano ancora, di solito dopo i primi dieci minuti."],
["🪂", "Il paracadute del passaggio", "Il passaggio lungo di {n} ha un paracadute: scende lentamente, con tempo per pensare, per cambiare idea e per dare l'indirizzo a qualcun altro."],
["🧸", "L'orsetto portafortuna", "In borsa {n} ha un orsetto portafortuna. L'orsetto è stanco: dopo mesi di sconfitte ha chiesto un trasferimento in porta."],
["🎹", "Il pianoforte del centrocampo", "Quando {n} tocca palla a centrocampo sembra suonare un pianoforte. Peccato manchino il pianoforte e la musica. E il pallone."],
["📏", "La distanza di sicurezza", "{n} mantiene sempre una distanza di sicurezza dal pallone: due metri e mezzo. Dice che lo rispetta. Il pallone dice che si sente un po' solo."],
["🦷", "Il sorriso del gol", "Ogni volta che {n} segna fa un sorriso enorme. Poi si accorge che il gol era nella porta sbagliata. Il sorriso resta, un po' più piccolo."],
["🕰️", "Il ritardo cosmico", "{n} arriva sempre in ritardo di quindici minuti. Gli scienziati hanno scoperto che il suo orologio va avanti e basta: è il tempo ad aspettarlo."],
["🛎️", "L'arbitro condiscendente", "L'arbitro, quando passa {n}, abbassa il fischietto con un sorriso. Non è un favoritismo: è la pietà. Il fischietto accetta la pace."],
["🥨", "Lo spuntino non autorizzato", "Nel mezzo del secondo tempo {n} ha tirato fuori uno spuntino. Gli avversari hanno chiesto se potevano unirsi. Nessuno ha toccato il pallone per tre minuti."],
["🪅", "La festa a sorpresa", "La squadra ha organizzato una festa a sorpresa per {n}, per i dieci gol segnati. Erano dieci gol subiti, ma la torta era buona lo stesso."],
["🧭", "La bussola del pallone", "{n} ha una bussola per capire dov'è il pallone. Non funziona mai. Il nord indica sempre la birra di fine partita."],
["🪛", "La vite sul tacchetto", "{n} stringe le viti sui tacchetti per quindici minuti prima di ogni partita. Poi gioca senza scarpe. Dice che è una strategia di allenamento. Lo sguardo dei compagni dice altro."],
["🎰", "La slot del dribbling", "Il dribbling di {n} è come una slot machine: tre simboli, nessuna combinazione vincente. Gli avversari ci giocano volentieri."],
["🦜", "Il pappagallo del tabellino", "Il pappagallo di {n} ripete sempre «gol di {n}». Al momento non c'è stato nessun gol. Il pappagallo ha una fiducia incrollabile."],
["🛁", "La vasca del dopopartita", "Dopo la partita {n} si fa un bagno con le bolle. Il giorno dopo racconta di aver fatto una grande prestazione, di aver vinto, di essere stato decisivo. Il bagno fu davvero un trionfo."],
["🎳", "Lo strike dell'intervento", "Quando {n} entra in scivolata, l'effetto è quello di un bowling: tutti a terra, il pallone fermo e il birillo in piedi. Il birillo è l'arbitro."],
["🪀", "Il gioco dello yo-yo", "{n} segue l'azione come uno yo-yo: avanti, indietro, avanti, indietro. Alla fine del secondo tempo il pallone è dove l'aveva lasciato."],
["🚪", "La porta girevole", "Nella difesa di {n} gli attaccanti entrano ed escono come in una porta girevole. Qualcuno ha chiesto di mettere un cartello: «Ingresso libero»."],
["🤝", "Il patto di {n} e {m}", "{n} e {m} hanno stretto un patto: chi segna paga il terzo tempo. Finora ha pagato sempre l'arbitro."],
["🎭", "Il gemello di {m}", "{m} giura che {n} abbia un gemello cattivo che gioca soltanto quando si perde. Il gemello, per ora, non risulta iscritto."],
["🥪", "Lo scambio del panino", "Si dice che {n} abbia ceduto {m} per un panino. Il panino era buono e il contratto non prevedeva restituzioni."],
["📦", "L'assist in viaggio", "{n} ha promesso un assist a {m}. L'assist è ancora in viaggio dal 2022. Il corriere ha già fatto due avvisi di giacenza."],
["🥊", "La sfida delle scuse", "{n} e {m} si sono sfidati a chi fa la scusa più elaborata per non venire alla partita. Pareggio: sono venuti tutti e due, in ritardo."],
["🧠", "Il piano geniale", "{n} e {m} hanno un piano geniale per vincere: non si sa quale sia, ma richiede che l'altra squadra sia assente. Finora non ha funzionato."],
["🎯", "La scommessa del martedì", "{m} ha scommesso con {n} che avrebbe segnato più di lui. {n} ha accettato. Il perdente deve portare le pettorine per un mese, in un sacchetto trasparente."],
["🚕", "Il passaggio sbagliato", "{n} ha dato un passaggio in auto a {m} e, per sbaglio, anche al pallone. Nessuno ha chiesto come, ma ora l'auto ha un'aria molto sportiva."],
["🎬", "La rivalità del secolo", "{n} e {m} sono rivali da anni: si sfidano su tutto. Ieri hanno discusso un'ora su come si dice «piede». Hanno pareggiato."],
["🍰", "La torta di {m}", "{m} ha portato una torta per festeggiare. {n} ha mangiato tre fette e ha chiesto se fosse per l'MVP. Era per il compleanno di {m}. La seconda fetta è stata più lenta."]

  else if(a==='rm'){S.rm=id}
  else if(a==='rmno'){S.rm=null}
  else if(a==='rmyes'){
    S.rm=null;
    if(!ADMIN)return;
    if(id===UID){toast('Non puoi rimuovere te stesso')}
    else{var nm=pname(id);del('players/'+id);if(D.rsvps[id])del('rsvps/'+id);if(D.levels[id])del('levels/'+id);toast(nm+' rimosso dal gruppo')}
  }
  else if(a==='reopen'){S.confirmRe=true;fxOn({run:function(){reveal($1('.panel .banner'))}})}
  else if(a==='reopenno'){S.confirmRe=false}
  else if(a==='reopenyes'){S.confirmRe=false;upd('matches/current',{official:null}).then(function(){toast('Formazione riaperta')})}
  else if(a==='unteams'){
    if(!ADMIN||!D.cur)return;
    if(!S.undoAsk){S.undoAsk=true;clearTimeout(S.undoT);S.undoT=setTimeout(function(){S.undoAsk=false;render()},4000)}
    else{clearTimeout(S.undoT);S.undoAsk=false;S.pick=null;upd('matches/current',{teamA:[],teamB:[],diff:0,teamsKey:''});toast('Squadre annullate')}}
  else if(a==='pick'){
    if(!ADMIN)return;
    var cA=(D.cur.teamA||[]).slice(),cB=(D.cur.teamB||[]).slice();
    if(!S.pick||S.pick===id){S.pick=S.pick===id?null:id}
    else{
      var sameA=cA.indexOf(S.pick)>=0&&cA.indexOf(id)>=0,sameB=cB.indexOf(S.pick)>=0&&cB.indexOf(id)>=0;
      if(sameA||sameB){S.pick=id}
      else{
        var x1=S.pick,x2=id,ia=cA.indexOf(x1)>=0?x1:x2,ib=ia===x1?x2:x1;
        cA[cA.indexOf(ia)]=ib;cB[cB.indexOf(ib)]=ia;
        S.pick=null;
        var key0=JSON.stringify(D.cur.teamA);
        fxOn({ok:function(){return JSON.stringify(D.cur.teamA)!==key0},run:function(){[ia,ib].forEach(function(z){var l=$1('.team li[data-id="'+z+'"]');pop(l,1.08);flash(l,tok('--green'))});pop($1('.balance b'),1.2)}});
        upd('matches/current',{teamA:cA,teamB:cB,diff:Math.abs(avg(cA)-avg(cB))});
        toast('Giocatori scambiati');
      }
    }
  }
  else if(a==='editm'){S.editM=!S.editM;if(S.editM)fxOn({run:function(){var f=$1('#mdate');if(f){reveal(f.closest('div'));cascade(qa('#mdate,#mtime,#mfield').map(function(x){return x.closest('label')}),70,10)}}})}
  else if(a==='role1'){var q=(m.roles||[]).slice(),o=q[1];q=[v];if(o&&o!==v)q.push(o);setP({roles:q});fxOn({run:function(){var b=$1('[data-a="role1"][data-v="'+v+'"]');pop(b,1.25);ring(b,tok('--green'));pop($1('.shirt'),1.08)}})}
  else if(a==='role2'){var q2=(m.roles||[]).slice(0,1);if(q2[0]===v)return;if((m.roles||[])[1]===v){setP({roles:q2});pop($1('[data-a="role2"][data-v="'+v+'"]'),.8)}else{q2.push(v);setP({roles:q2});fxOn({run:function(){var b=$1('[data-a="role2"][data-v="'+v+'"]');pop(b,1.25);ring(b,tok('--green'));pop($1('.shirt'),1.08)}})}}
  else if(a==='foot'){setP({foot:v});fxOn({ok:function(){return (me()||S.draft).foot===v},run:function(){var b=$1('[data-a="foot"][data-v="'+v+'"]');pop(b,1.22);ring(b,tok('--green'))}})}
  else if(a==='color'){setP({color:COLORS[+v]});fxOn({ok:function(){return (me()||S.draft).color===COLORS[+v]},run:function(){var b=$1('[data-a="color"][data-v="'+v+'"]');pop(b,1.4);ring(b,COLORS[+v]);var sh=$1('.shirt');pop(sh,1.15);ring(sh,COLORS[+v])}})}
  else if(a==='pcam'){
    if(!avHasPh(m)){pickPhoto();return}
    S.pmenu=!S.pmenu;
    if(!S.pmenu){closePm();return}
    render();
    if(typeof gsap!=='undefined'&&!calmFx()){var cb=document.querySelector('.pcam'),it=document.querySelectorAll('#pmenu .pmi');
      if(cb)gsap.fromTo(cb,{rotation:-25,scale:.85},{rotation:0,scale:1,duration:.5,ease:'back.out(2.4)'});
      it.forEach(function(el,i){var l=parseFloat(el.style.left),t=parseFloat(el.style.top);gsap.from(el,{x:75-21-l+40,y:75-21-t+30,scale:.2,opacity:0,rotation:-90,duration:.5,delay:i*.06,ease:'back.out(1.8)',clearProps:'opacity,transform'})})}
  }
  else if(a==='pmphoto'){pickPhoto();closePm()}
  else if(a==='phpick'){pickPhoto()}
  else if(a==='phdel'){S.pmenu=false;setP({photo:'',avc:'i'});if(me())render()}
  else if(a==='avc'){S.pmenu=false;if(v==='f'&&!m.photo){pickPhoto();return}setP({avc:v});fxOn({ok:function(){return (me()||S.draft).avc===v},run:function(){var b=$1('[data-a="avc"][data-v="'+v+'"]');pop(b,1.2);ring(b,tok('--green'));var x=$1('.pav .avatar');pop(x,1.3);ring(x,tok('--green'))}})}
  else if(a==='avi'){var ic=AVI[+v];setP({avi:ic,avc:'e'});fxOn({ok:function(){return (me()||S.draft).avi===ic},run:function(){var b=$1('[data-a="avi"][data-v="'+v+'"]');pop(b,1.35);var x=$1('.pav .avatar');pop(x,1.3);ring(x,tok('--green'))}})}
  else if(a==='avs'){setP({avs:v});fxOn({ok:function(){return (me()||S.draft).avs===v},run:function(){var b=$1('[data-a="avs"][data-v="'+v+'"]');pop(b,1.2);ring(b,tok('--green'));var x=$1('.pav .avatar');pop(x,1.3)}})}
  else if(a==='join'){
    var dr=S.draft,nick=(dr.nick||'').trim();
    if(!nick){toast('Scrivi il tuo nome');return}
    setDoc('players/'+UID,{nick:nick,aka:dr.aka||'',motto:dr.motto||'',num:dr.num,roles:dr.roles,foot:dr.foot,color:dr.color,avc:dr.avc||'i',photo:dr.photo||'',avi:dr.avi||AVI[0],avs:dr.avs||'c',forfeits:0}).then(function(){S.tab='partita';fxOn({run:function(){cascade(qa('#screen .panel'),90,22)}});toast('Benvenuto, '+nick)});
  }
  render();
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='aq'){S.aq=el.value.slice(0,40);arcRefresh();return}
  if(el.id==='phname')S.phname=el.value.slice(0,14).replace(/[<>&"]/g,'');
  if(el.id==='gname')S.gname=el.value.slice(0,14).replace(/[<>&"]/g,'');
  if(el.id==='aka'||el.id==='motto'){var v0=el.value,wd=v0.split(/\s+/).filter(Boolean).length,mx=LIM[el.id][0],pv=el.dataset.pv,lv;
    if(wd>mx)lv=(pv!==undefined&&v0.length-pv.length<=1)?pv:limField(el.id,v0);else lv=limField(el.id,v0);
    if(lv!==el.value)el.value=lv;el.dataset.pv=lv;if(!me())S.draft[el.id]=lv}
  if(!me()){
    if(el.id==='nick')S.draft.nick=el.value.replace(/[<>&"]/g,'').slice(0,14);
    if(el.id==='num'){var n=parseInt(el.value,10);if(n>=1&&n<=99)S.draft.num=n}
  }
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.classList&&e.target.classList.contains('rsel')){var se=e.target;if(!se.value)return;if(se.dataset.pid)arcReplace(se.dataset.mid,se.dataset.pid,se.value);else if(se.dataset.k)arcAdd(se.dataset.mid,se.dataset.k,se.value);return}
  if(e.target&&e.target.id==='am'){S.am=e.target.value;S.openH=null;arcRefresh();return}
  if(e.target&&e.target.id==='pdate'&&S.past){S.past.date=e.target.value;return}
  if(e.target&&(e.target.id==='pnameA'||e.target.id==='pnameB')&&S.past){var pn=cleanName(e.target.value);if(pn){S.past['name'+e.target.id.slice(5)]=pn;render()}else e.target.value=tn(S.past,e.target.id.slice(5));return}
  var t0=e.target;if(t0&&t0.id==='photo'&&t0.files&&t0.files[0]){var fl=t0.files[0];t0.value='';readPhoto(fl);return}
  var el=e.target,id=el.id;
  if(id==='nick'&&me()){var nv=el.value.replace(/[<>&"]/g,'').trim().slice(0,14);if(nv)upd('players/'+UID,{nick:nv})}
  else if((id==='aka'||id==='motto')&&me()){var av=limField(id,el.value).trim(),ao={};ao[id]=av;upd('players/'+UID,ao)}
  else if(id==='num'&&me()){var n=parseInt(el.value,10);if(n>=1&&n<=99)upd('players/'+UID,{num:n})}
  else if(id==='mdate'&&el.value)upd('matches/current',{date:el.value});
  else if((id==='nameA'||id==='nameB')&&ADMIN){var nn=cleanName(el.value),o={};if(nn){o[id]=nn;upd('matches/current',o)}else el.value=tn(D.cur,id.slice(4))}
  else if(id==='mtime')upd('matches/current',{time:el.value});
  else if(id==='mcity')upd('matches/current',{city:el.value.replace(/[<>&"]/g,'').trim().slice(0,40)});
  else if(id==='mfield')upd('matches/current',{field:el.value.replace(/[<>&"]/g,'').trim().slice(0,60)});
});
document.addEventListener('focusout',function(){setTimeout(function(){var a=document.activeElement;if(S.dirty&&!(a&&a.tagName==='INPUT'))render()},0)});

/* collegamento ai dati */
function toMap(s){var o={};s.docs.forEach(function(d){o[d.id]=d.data()});return o}
function sub(path,fn){DB.collection(path).onSnapshot(function(s){fn(s);changed()},function(e){S.err=e&&e.code||'err';changed()})}
async function init(){
  render();
  var use=window.claude&&window.claude.use?function(n){return window.claude.use(n)}:function(){return Promise.resolve(null)};
  var user=await use('user');DB=await use('db');
  if(user){
    var v=await user.me();UID=v.id;MYNAME=(v.name||'').split(' ')[0].slice(0,14);
    var cw=await user.can('data.write');CANWRITE=cw!==false;ADMIN=await user.canEdit();
  }
  S.draft.nick=MYNAME;
  if(!DB||!UID){DB=null;S.err='nodb';S.ready=true;render();return}
  sub('players',function(s){D.players=toMap(s)});
  sub('rsvps',function(s){D.rsvps=toMap(s)});
  sub('levels',function(s){D.levels=toMap(s)});
  sub('mvpvotes',function(s){D.mvpv=toMap(s)});
  sub('history',function(s){D.history=s.docs.map(function(d){var x=d.data();x._id=d.id;return x}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')})});
  DB.doc('matches/last').onSnapshot(function(s){D.last=s.exists?s.data():null;changed()},function(){});
  DB.doc('matches/current').onSnapshot(function(s){D.cur=s.exists?s.data():null;if(ADMIN&&D.cur&&D.cur.status==='closed'&&!S.autoNext){S.autoNext=1;newMatch()}changed()},function(e){S.err=e&&e.code||'err';changed()});
}
init();
})();
</script>
