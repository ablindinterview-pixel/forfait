<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<link rel="icon" href="icona.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forfait">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Forfait</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: colonna da telefono, adesivi inclinati, bordi spessi e ombre piene; barra a 4 pulsanti colorati in basso. */
:root{
  --bg:#ffd83d; --surface:#ffffff; --ink:#1a1033; --muted:#5a4b7a; --soft:#fff3b8;
  --pink:#ff4f8b; --green:#2bd67b; --blue:#3b6bff; --yellow:#ffd83d; --on-acc:#1a1033; --shadow:#1a1033;
  --display:'Bowlby One','Arial Black',sans-serif; --body:'Figtree',system-ui,sans-serif;
  --bw:3px; --so:4px; --rot:1deg; --rk:1; --bc:var(--ink);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1033; --surface:#2a1b52; --ink:#fff6d6; --muted:#b9a9e0; --soft:#3a2870; --shadow:#07030f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1033; --surface:#2a1b52; --ink:#fff6d6; --muted:#b9a9e0; --soft:#3a2870; --shadow:#07030f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--body);margin:0;padding-inline:16px}
.app{max-width:460px;margin:0 auto;padding-block:18px 104px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink)}
.brand .bi{width:50px;height:50px;flex:none}
.brand .bw{display:block;width:128px;height:auto}
.brand small{display:block;font:800 10px/1.2 var(--body);letter-spacing:.12em;margin-top:6px;color:var(--muted)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}


.me{font:700 12px var(--body);text-align:right;background:var(--surface);border:var(--bw) solid var(--bc);border-radius:99px;padding:6px 12px}
h2{font:400 30px/1 var(--display);text-transform:uppercase;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--ink);opacity:.8;margin:0 0 16px;font-weight:600}
.label{font:800 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:var(--bw) solid var(--bc);border-radius:calc(var(--rk) * 18px);box-shadow:var(--so) var(--so) 0 var(--shadow);padding:14px;margin-bottom:18px}
.ticket{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.ticket .when{font:400 28px/1 var(--display);text-transform:uppercase}
.ticket .where{color:var(--muted);font-weight:600;margin-top:4px}
.count{font:400 56px/0.9 var(--display);text-align:right;font-variant-numeric:tabular-nums}
.count span{font-size:24px;color:var(--muted)}
.bar{height:18px;border-radius:99px;background:var(--soft);border:var(--bw) solid var(--bc);overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;background:var(--green);border-right:var(--bw) solid var(--bc);transition:width .3s}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:var(--bw) solid var(--bc);background:var(--surface);border-radius:calc(var(--rk) * 12px);padding:10px 6px;font-weight:800;box-shadow:var(--so) var(--so) 0 var(--shadow)}
.btn:active,.primary:active,.ghost:active,.chip:active{transform:translate(2px,2px);box-shadow:var(--so) var(--so) 0 var(--shadow)}
.btn.on-yes{background:var(--green);color:var(--on-acc)}
.btn.on-maybe{background:var(--yellow);color:var(--on-acc)}
.btn.on-no{background:var(--pink);color:var(--on-acc)}
.primary{width:100%;background:var(--pink);color:var(--on-acc);border:var(--bw) solid var(--bc);border-radius:calc(var(--rk) * 14px);padding:14px;font:400 19px var(--display);text-transform:uppercase;box-shadow:var(--so) var(--so) 0 var(--shadow)}
.ghost{width:100%;background:var(--surface);border:var(--bw) solid var(--bc);border-radius:calc(var(--rk) * 14px);padding:12px;font:800 15px var(--body);margin-top:12px;box-shadow:var(--so) var(--so) 0 var(--shadow)}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:2px dashed var(--soft);min-width:0}
.row:first-of-type{border-top:0}
.row>.avatar,.row>.avw{margin-left:8px}
.row .name{flex:1;padding-left:8px;min-width:0;font-weight:800;overflow-wrap:anywhere}
.row .name small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.pill{font:800 11px var(--body);letter-spacing:.05em;text-transform:uppercase;border:2px solid var(--ink);border-radius:99px;padding:2px 9px;white-space:nowrap;color:var(--on-acc)}
.row .pill{margin-right:16px}
.pill.wait{background:transparent;color:var(--ink);border:2px dashed var(--muted)}
.pill.yes{background:var(--green)}.pill.maybe{background:var(--yellow)}.pill.no{background:var(--pink)}
.avatar{width:36px;height:36px;border-radius:50%;border:var(--bw) solid var(--bc);background:var(--blue);color:#fff;display:grid;place-items:center;font:400 15px var(--display);flex:none}
.avatar.av-q{border-radius:10px}
.avatar.av-e{border-radius:0;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
.avatar.av-s{border-radius:0;clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%)}
.avatar .emo{font-size:19px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.avatar.big{width:56px;height:56px;font-size:24px}
.avatar.big .emo{font-size:30px}
.avrow{display:flex;align-items:center;gap:14px;margin:18px 0 12px}
.emos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.me{background:none!important;border:0!important;padding:0!important;display:flex;align-items:center;gap:8px;border-radius:0!important}
.me .adm{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.06em;border:var(--bw) solid var(--bc);border-radius:99px;padding:3px 8px;background:var(--surface)}
.me .avatar.big{width:40px;height:40px;font-size:17px}
.me .avatar.big .emo{font-size:22px}
.avw{position:relative;display:inline-block;flex:none;line-height:0}
.avw .crown{position:absolute;left:50%;top:-11px;width:22px;height:auto;margin-left:-16px;transform:rotate(-18deg);transform-origin:50% 100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));pointer-events:none}
.avw.big .crown{width:26px;margin-left:-19px;top:-13px}
.me .avw{margin-top:6px}
.trobtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.trobtn .trosum{flex:1;display:flex;gap:4px;font-size:20px;min-width:0;overflow:hidden}
.trobtn b{font-size:14px;flex:none}
#trosheet{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center}
#trosheet .tsb{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#trosheet .tsp{position:relative;width:100%;max-width:560px;max-height:85vh;display:flex;flex-direction:column;background:var(--surface);border:var(--bw) solid var(--bc);border-bottom:0;border-radius:18px 18px 0 0;padding:14px 14px max(14px,env(safe-area-inset-bottom))}
#trosheet .tsh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#trosheet .tsh button{width:auto;flex:none;padding:6px 16px}
.trobtn .trosum small{font-size:12px;font-weight:600;color:var(--muted)}
#trosheet .tsc{overflow:auto;-webkit-overflow-scrolling:touch}
.cd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 4px;padding:8px 12px;border:var(--bw) dashed var(--bc);border-radius:12px;background:var(--soft)}
.cd .label{margin:0}.cd b{font:700 17px var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.cd.soon b{color:var(--pink)}.cd.over{opacity:.75}.cd.over .label{visibility:hidden}
.tlist{display:grid;gap:8px;margin-top:10px}
.tro{display:flex;align-items:center;gap:10px;border:var(--bw) solid var(--bc);border-radius:12px;padding:10px;opacity:.55;filter:grayscale(1);min-width:0}
.tro.on{opacity:1;filter:none;border-color:var(--tc);background:rgba(255,255,255,.03)}
.tro .ti{font-size:26px;line-height:1;flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:3px solid var(--tc);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tro .tb{flex:1;min-width:0}
.tro .tt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tro b{font-size:14px;line-height:1.15}
.tro .tl{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--tc);flex:none}
.tro .pips{display:flex;gap:4px;margin:5px 0 4px}
.tro .pips i{width:18px;height:5px;border-radius:3px;background:var(--soft)}
.tro small{display:block;color:var(--muted);font-size:11px;font-weight:600;line-height:1.25}
.tro .pbar{height:4px;border-radius:2px;background:var(--soft);margin-top:5px;overflow:hidden}
.tro .pbar i{display:block;height:100%;background:var(--tc);border-radius:2px}
.pitch{position:relative;height:400px;border:var(--bw) solid var(--bc);border-radius:14px;background:linear-gradient(180deg,#14532d,#0f3d22);overflow:hidden;margin-bottom:8px}
.pitch i{position:absolute;border:2px solid rgba(255,255,255,.28);pointer-events:none}
.pitch .pl1{left:6%;right:6%;top:5%;bottom:5%;border-radius:6px}
.pitch .pl2{left:6%;right:6%;top:50%;height:0;border-width:2px 0 0}
.pitch .pl3{left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%}
.pslot{position:absolute;transform:translate(-50%,-50%);width:112px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.pslot b{font-size:12.5px;line-height:1.1;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);max-width:112px;overflow-wrap:anywhere}
.pslot small{font-size:10.5px;font-weight:700;color:#d6f5de;line-height:1.1}
.pslot em{font:700 9px var(--body);font-style:normal;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.65)}
.pslot .emptyslot{background:rgba(255,255,255,.12);color:rgba(255,255,255,.6)}
.hr{display:flex;align-items:center;gap:10px}
.shr{width:40px;height:40px;border-radius:50%;border:var(--bw) solid var(--bc);background:var(--surface);color:var(--ink);display:grid;place-items:center;padding:0;cursor:pointer}
.emob{aspect-ratio:1;font-size:22px;border:var(--bw) solid var(--bc);border-radius:10px;background:var(--card,transparent);color:inherit;padding:0;line-height:1}
.emob.on{outline:3px solid var(--ink);outline-offset:2px}
.label.sm{font-size:12px;opacity:.8}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:9px;height:9px;border-radius:50%;background:transparent;border:2px solid var(--ink)}
.dots i.f{background:var(--ink)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team{background:var(--surface);border:var(--bw) solid var(--bc);border-radius:calc(var(--rk) * 18px);box-shadow:var(--so) var(--so) 0 var(--shadow);overflow:hidden;min-width:0}
.team h3{margin:0;padding:10px 12px;background:var(--c);color:var(--cf);font:400 20px/1 var(--display);text-transform:uppercase;border-bottom:var(--bw) solid var(--bc)}
.team .avg{font:800 12px var(--body);color:var(--muted);padding:8px 12px 0;font-variant-numeric:tabular-nums}
.team ul{margin:0;padding:4px 12px 10px}
.team li{list-style:none;padding:6px 0;border-top:2px dashed var(--soft);display:flex;justify-content:space-between;gap:6px;min-width:0;overflow-wrap:anywhere;font-weight:700}
.team li:first-child{border-top:0}
.tags{display:block;font:800 10px var(--body);letter-spacing:.06em;color:var(--muted)}
.gk{font:800 10px var(--body);background:var(--yellow);color:var(--on-acc);border:2px solid var(--ink);border-radius:calc(var(--rk) * 6px);padding:0 5px;align-self:center}
.balance{background:var(--surface);border:var(--bw) solid var(--bc);border-radius:calc(var(--rk) * 14px);padding:10px 12px;margin:0 0 16px;transform:rotate(calc(-1 * var(--rot)));box-shadow:var(--so) var(--so) 0 var(--shadow)}
.balance b{display:block;font:400 18px/1.15 var(--display);text-transform:uppercase}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:50%;border:var(--bw) solid var(--bc);background:var(--yellow);color:var(--on-acc);font-weight:900;font-size:18px;line-height:1}
.stepper output{min-width:26px;text-align:center;font:400 22px var(--display);font-variant-numeric:tabular-nums}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.score .tn{display:inline-block;font:400 15px var(--display);text-transform:uppercase;background:var(--c);color:var(--cf);border:var(--bw) solid var(--bc);border-radius:99px;padding:3px 12px}
.score .big{font:400 72px/1 var(--display);font-variant-numeric:tabular-nums}
.score .stepper{justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:var(--bw) solid var(--bc);background:var(--surface);border-radius:99px;padding:5px 13px;font-weight:800;font-size:14px;box-shadow:var(--so) var(--so) 0 var(--shadow)}
.chips.r4{gap:6px;flex-wrap:nowrap}.chips.r4 .chip{padding:6px 0;flex:1;text-align:center;font-size:13px}
.chip small{font-size:10px;font-weight:700;opacity:.8;margin-left:3px;text-transform:uppercase;letter-spacing:.3px}
.chip.on{background:var(--yellow);color:var(--on-acc);transform:rotate(calc(-2 * var(--rot)))}
.rate{display:flex;gap:4px}
.rate button{width:32px;height:32px;border-radius:50%;border:var(--bw) solid var(--bc);background:var(--surface);font-weight:800}
.rate button.on{background:var(--green);color:var(--on-acc)}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.award{background:var(--surface);border:var(--bw) solid var(--bc);border-radius:calc(var(--rk) * 16px);box-shadow:var(--so) var(--so) 0 var(--shadow);padding:12px;min-width:0}
.award:nth-child(1){transform:rotate(calc(-1.5 * var(--rot)));background:var(--pink);color:var(--on-acc)}
.award:nth-child(2){transform:rotate(calc(1 * var(--rot)));background:var(--green);color:var(--on-acc)}
.award:nth-child(3){transform:rotate(calc(1.2 * var(--rot)));background:var(--blue);color:#fff}
.award:nth-child(4){transform:rotate(calc(-1 * var(--rot)))}
.award .label{color:inherit;opacity:.85}
.award .v{font:400 22px/1.05 var(--display);text-transform:uppercase;margin-top:6px;overflow-wrap:anywhere}
.award .d{font-size:13px;font-weight:700;margin-top:4px}
.tabs2{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:2px 2px 4px}
.tabs2 .chip{white-space:nowrap;padding:7px 14px}
.hbar{flex:1.2;height:12px;background:var(--soft);border:2px solid var(--ink);border-radius:99px;overflow:hidden;min-width:40px}
.hbar i{display:block;height:100%;background:var(--pink)}
.num{font:400 20px var(--display);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.hist{padding:10px 0;border-top:2px dashed var(--soft)}
.hist:first-child{border-top:0}
.hist .res{font:400 20px var(--display);text-transform:uppercase;font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:var(--bw) solid var(--bc);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
nav .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
nav button{border:var(--bw) solid var(--bc);background:var(--surface);padding:8px 2px;border-radius:calc(var(--rk) * 12px);font:400 12px var(--display);text-transform:uppercase;box-shadow:var(--so) var(--so) 0 var(--shadow)}
nav button[aria-selected="true"]{background:var(--pink);color:var(--on-acc);transform:translateY(-3px) rotate(calc(-2 * var(--rot)))}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) rotate(calc(-1 * var(--rot)));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:calc(var(--rk) * 14px);border:var(--bw) solid var(--bc);font-weight:800;max-width:90vw;text-align:center}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;font-weight:600}
.empty{padding:22px 8px;text-align:center;font-weight:700}
.demo{font-size:12px;color:var(--ink);opacity:.7;text-align:center;margin-top:6px;font-weight:600}
.closed{background:var(--green);color:var(--on-acc);border:var(--bw) solid var(--bc);border-radius:calc(var(--rk) * 18px);box-shadow:var(--so) var(--so) 0 var(--shadow);padding:16px;margin-bottom:18px;transform:rotate(calc(-1 * var(--rot)))}
.closed .res{font:400 34px/1.05 var(--display);text-transform:uppercase;margin:4px 0}
.closed .label{color:inherit}

/* Stile Stadio: scuro, neon, numeri da tabellone. Resta uguale in chiaro e scuro. */
:root[data-skin="stadio"]{--bg:#0b0f1a;--surface:#141b2d;--ink:#f2f5ff;--muted:#8d9ac0;--soft:#222c4a;--pink:#ff4d7d;--green:#39ff88;--yellow:#ffe14a;--blue:#3d8bff;--on-acc:#07101f;--shadow:#000;--bc:#2f3d66;--bw:2px;--so:0px;--rot:0deg;--rk:.5;--display:'Chakra Petch','Arial Narrow',sans-serif;--body:'Barlow Semi Condensed',system-ui,sans-serif;color-scheme:dark}
:root[data-skin="stadio"] .count,:root[data-skin="stadio"] .score .big,:root[data-skin="stadio"] .num{color:var(--green)}
:root[data-skin="stadio"] .panel,:root[data-skin="stadio"] .team{box-shadow:0 0 0 1px var(--bc),0 0 22px rgba(61,139,255,.18)}
:root[data-skin="stadio"][data-mode="light"]{--bg:#eef2fb;--surface:#ffffff;--ink:#0b1226;--muted:#56628a;--soft:#e2e8f7;--bc:#aab6d8;--shadow:#fff;--green:#17c46c;--yellow:#f7c800;--pink:#f0436f;--blue:#2f78f0;color-scheme:light}
:root[data-skin="stadio"][data-mode="light"] .count,:root[data-skin="stadio"][data-mode="light"] .score .big,:root[data-skin="stadio"][data-mode="light"] .num{color:#0a8c4c}
:root[data-skin="stadio"][data-mode="light"] .panel,:root[data-skin="stadio"][data-mode="light"] .team{box-shadow:0 0 0 1px var(--bc),0 6px 20px rgba(30,60,140,.10)}
:root[data-mode="light"] .field input::-webkit-calendar-picker-indicator{filter:none}
.aka{color:var(--muted);font-weight:600;font-size:.9em}
.mot{font-style:italic;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:reduce){:root{--rot:0deg}}

.me{color:var(--ink);cursor:pointer}
.fig{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.fig .shirt{width:84px;height:84px;border-radius:calc(var(--rk) * 18px);border:var(--bw) solid var(--bc);display:grid;place-items:center;font:700 40px var(--display);color:var(--on-acc);font-variant-numeric:tabular-nums}
.fig .nm{font:700 26px/1.05 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
.fig .rl{color:var(--muted);font-weight:600;margin-top:4px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;margin-bottom:6px}
.field input{width:100%;font:600 16px var(--body);color:var(--ink);background:var(--bg);border:var(--bw) solid var(--bc);border-radius:calc(var(--rk) * 10px);padding:10px 12px}
.field input{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:46px;margin:0}
.field input[type=date],.field input[type=time]{inline-size:100%;line-height:1.2}
.field input::-webkit-date-and-time-value{text-align:left;min-height:1.2em;margin:0}
.field input::-webkit-calendar-picker-indicator{opacity:.8;filter:invert(1)}
.field input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.swatch{width:100%;aspect-ratio:1;max-width:44px;border-radius:50%;border:var(--bw) solid var(--bc);padding:0}
.swatch[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:3px}
.grp{margin-bottom:14px}
.grp .label{display:block;margin-bottom:8px}

  .stepper button:hover,.rate button:hover,.swatch:hover{transform:scale(1.08)}

}

.whyl{margin:8px 0 0;padding-left:18px;font-weight:600;font-size:14px;color:var(--muted)}

.hdet{padding:2px 0 6px}
.toast:not([hidden]){animation:toastIn .5s cubic-bezier(.2,1.4,.4,1)}
.toast.out{animation:toastOut .26s ease-in forwards}
@keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(26px) scale(.88)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(14px) scale(.95)}}
.btn:not(:disabled):active,.chip:active,.ghost:active,.primary:not(:disabled):active{filter:brightness(1.25)}

          if(e&&e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')err.textContent='Accesso non riuscito. Riprova.';
        });
      });
    }
  }
  function dbApi(db){
    function clean(d){return JSON.parse(JSON.stringify(d))}
    return {
      doc:function(p){var r=db.doc(p);return {
        set:function(d){return r.set(clean(d))},
        update:function(d){return r.update(clean(d))},
        delete:function(){return r.delete()},
        onSnapshot:function(a,b){return r.onSnapshot(a,b)}
      }},
      collection:function(p){return db.collection(p)}
    };
  }

        return navigator.share({files:[file]}).then(function(){return {status:'saved'}},function(e){if(e&&e.name==='AbortError')return Promise.reject({code:'cancelled'});return dl()});

    }});
    if(name==='db')return boot().then(function(c){return dbApi(c.db)});
    if(name==='user')return boot().then(function(c){

        can:function(){return Promise.resolve(true)},
        canEdit:function(){return adminP}
      };
    });
    return Promise.resolve(null);
  }};
})();

/* Forfait · introduzione al primo ingresso */
(function(){
  var KEY='forfait_intro_v1';
  function seen(){try{return localStorage.getItem(KEY)==='1'}catch(e){return false}}
  function mark(){try{localStorage.setItem(KEY,'1')}catch(e){}}
  function standalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true}
  function install(){
    if(standalone())return '';
    var ua=navigator.userAgent||'',ios=/iPad|iPhone|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
    return '<div class="itip"><b>Tienila sul telefono</b><span>'+(ios?'Tocca il tasto Condividi di Safari e scegli «Aggiungi alla schermata Home».':'Dal menu del browser scegli «Installa app» o «Aggiungi a schermata Home».')+'</span></div>';
  }
  function slides(){return [
    {i:'👋',t:'Benvenuto in Forfait',p:'L’app del calcetto del martedì: risposte, formazione, squadre e statistiche del gruppo, tutto in un posto.'},
    {i:'✅',t:'Rispondi alla partita',p:'Ogni settimana tocca «Ci sono», «Forse» o «Non ci sono» entro il termine indicato. Se i posti sono finiti vai in coda e entri se qualcuno si ritira.',x:'<div class="ichips"><span style="background:var(--green)">Ci sono</span><span style="background:var(--yellow)">Forse</span><span style="background:var(--pink)">Non ci sono</span></div>'},
    {i:'📋',t:'Formazione e forfait',p:'Quando l’admin rende ufficiale la formazione, chi si ritira dopo conta come forfait. Fino ad allora puoi cambiare idea senza conseguenze.'},
    {i:'⚖️',t:'Squadre equilibrate',p:'Le squadre si sorteggiano in base ai livelli e ai ruoli, così sono pari. Dalla scheda Partita puoi indicare il livello dei compagni da 1 a 5.'},
    {i:'🏆',t:'Risultato, MVP e Pagella',p:'Dopo la partita l’admin inserisce punteggio, gol e assist, e tutti votano l’MVP. In Pagella trovi classifiche, premi, record e trofei a livelli.'},
    {i:'🧑',t:'Il tuo profilo',p:'Tocca il tuo avatar in alto a destra per scegliere nome, soprannome, ruoli, colore e forma. Con il tasto Condividi mandi il riepilogo al gruppo.',x:install()}
  ]}
  function css(){
    if(document.getElementById('introcss'))return;
    var s=document.createElement('style');s.id='introcss';
    s.textContent='#intro{position:fixed;inset:0;z-index:98;background:var(--bg,#0b0f1a);color:var(--ink,#fff);display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 20px max(18px,env(safe-area-inset-bottom))}'+
    '#intro .itop{display:flex;justify-content:flex-end;min-height:40px}'+
    '#intro .iskip{background:none;border:0;color:var(--muted,#8d9ac0);font:700 14px var(--body,sans-serif);padding:10px 4px;cursor:pointer}'+
    '#intro .ibody{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;max-width:420px;margin:0 auto;width:100%}'+
    '#intro .iico{width:112px;height:112px;border-radius:50%;border:3px solid var(--bc,#2f3d66);background:var(--surface,#141b2d);display:grid;place-items:center;font-size:54px;line-height:1;margin-bottom:26px;box-shadow:0 0 28px rgba(61,139,255,.25);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}'+
    '#intro h2{margin:0 0 12px;font:700 30px/1.1 var(--display,sans-serif);text-transform:uppercase}'+
    '#intro p{margin:0;font-size:17px;line-height:1.45;color:var(--ink,#fff)}'+
    '#intro .ichips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:20px}'+
    '#intro .ichips span{padding:8px 14px;border-radius:99px;border:3px solid var(--bc,#2f3d66);color:#07101f;font-weight:800;font-size:14px}'+
    '#intro .itip{margin-top:22px;padding:12px 14px;border:2px dashed var(--bc,#2f3d66);border-radius:14px;text-align:left;font-size:14px;line-height:1.4}'+
    '#intro .itip b{display:block;margin-bottom:2px}'+
    '#intro .idots{display:flex;justify-content:center;gap:8px;margin:14px 0 16px}'+
    '#intro .idots i{width:9px;height:9px;border-radius:50%;background:var(--soft,#222c4a)}'+
    '#intro .idots i.on{background:var(--green,#39ff88);width:26px;border-radius:5px}'+
    '#intro .inav{display:flex;gap:10px;max-width:420px;width:100%;margin:0 auto}'+
    '#intro .inav button{flex:1}';
    document.head.appendChild(s);
  }
  window.showIntro=function(force){
    if(!force&&seen())return;
    if(document.getElementById('intro'))return;
    css();
    var S=slides(),n=0,box=document.createElement('div');
    box.id='intro';box.setAttribute('role','dialog');box.setAttribute('aria-label','Introduzione a Forfait');
    document.body.appendChild(box);
    function done(){mark();box.remove()}
    function draw(dir){
      var s=S[n],last=n===S.length-1;
      box.innerHTML='<div class="itop"><button class="iskip" data-i="skip">'+(last?'':'Salta')+'</button></div>'+
        '<div class="ibody" id="ibody"><div class="iico">'+s.i+'</div><h2>'+s.t+'</h2><p>'+s.p+'</p>'+(s.x||'')+'</div>'+
        '<div class="idots">'+S.map(function(_,k){return '<i'+(k===n?' class="on"':'')+'></i>'}).join('')+'</div>'+
        '<div class="inav">'+(n>0?'<button class="ghost" data-i="prev">Indietro</button>':'')+'<button class="primary" data-i="next">'+(last?'Inizia':'Avanti')+'</button></div>';
      var b=document.getElementById('ibody');
      if(dir&&b&&b.animate)b.animate([{opacity:0,transform:'translateX('+(dir*36)+'px)'},{opacity:1,transform:'none'}],{duration:260,easing:'ease-out'});
    }
    box.addEventListener('click',function(e){
      var t=e.target.closest&&e.target.closest('[data-i]');if(!t)return;
      var a=t.getAttribute('data-i');
      if(a==='skip')done();
      else if(a==='prev'&&n>0){n--;draw(-1)}
      else if(a==='next'){if(n<S.length-1){n++;draw(1)}else done()}
    });
    draw(0);
  };
})();
</script>
<script>
(function(){
document.documentElement.setAttribute('data-skin','stadio');
try{if(localStorage.getItem('forfait-mode')==='light'){document.documentElement.setAttribute('data-mode','light')}}catch(e){}
var RL=['Porta','Difesa','Laterale','Attacco'],AB={Porta:'POR',Difesa:'DIF',Laterale:'LAT',Attacco:'ATT'};
var COLORS=['#3d8bff','#ff4d7d','#39ff88','#ffe14a','#b58cff','#ff8a3d','#2fd6ff','#ff3b3b','#c6ff3d','#ff5fd2','#14b8a6','#f1f5f9','#c8913a','#6c6cf0'];
function need(){return D.cur&&D.cur.format==='calciotto'?14:10}
function per(){return need()/2}
function fmtName(o){return o&&o.format==='calciotto'?'Calciotto':'Calcetto'}
var DB=null,UID=null,MYNAME='',CANWRITE=true,ADMIN=false;
var D={players:{},rsvps:{},levels:{},mvpv:{},history:[],cur:null};
var S={gl:3,gr:'Laterale',gname:'',corr:null,tab:'partita',sub:'marcatori',rating:false,editM:false,ready:false,err:'',dirty:false,
  res:{sa:0,sb:0,goals:{},assists:{},mvp:null,forMatch:null},
  draft:{nick:'',num:10,roles:['Attacco'],foot:'Destro',color:COLORS[0]}};
var TABS=[['partita','Partita'],['squadre','Squadre'],['risultato','Risultato'],['pagella','Pagella']];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function me(){return UID?D.players[UID]:null}
function isG(id){return String(id).indexOf('g_')===0}
function guestList(){return (D.cur&&D.cur.guests)||[]}
function gmap(){var g={};D.history.forEach(function(m){(m.guests||[]).forEach(function(x){g[x.id]=x})});guestList().forEach(function(x){g[x.id]=x});return g}
function P(id){return D.players[id]||(isG(id)?gmap()[id]:null)||null}
function atOf(id){return isG(id)?((P(id)||{}).at||0):((D.rsvps[id]||{}).at||0)}
function pname(id){var p=P(id);return p&&p.nick?p.nick:'Giocatore'}
function roles(id){var p=P(id);return p&&p.roles&&p.roles.length?p.roles:['Laterale']}
function ini(id){return pname(id).charAt(0).toUpperCase()}
var AVI=['⚽','🧤','🦁','🐺','🦅','🐂','🔥','⚡','👑','🚀','🎯','🛡️'];
var AVS=[['c','Cerchio'],['q','Quadrato'],['e','Esagono'],['s','Scudo']];
var AVC=[['i','Iniziale'],['n','Numero'],['e','Icona']];
function avInner(id,p){p=p||P(id)||{};if(isG(id))return esc(ini(id));if(p.avc==='n'&&p.num!=null&&p.num!=='')return esc(p.num);if(p.avc==='e'&&p.avi)return '<span class="emo">'+esc(p.avi)+'</span>';return esc(ini(id))}
var CROWN='<svg class="crown" viewBox="0 0 24 18" aria-label="MVP dell\'ultima partita"><path d="M2 15L1 4l6 5 5-8 5 8 6-5-1 11z" fill="#ffd23f" stroke="#7a5a00" stroke-width="1.4" stroke-linejoin="round"/><rect x="2" y="15" width="20" height="2.4" rx="1" fill="#e0a800" stroke="#7a5a00" stroke-width="1.2"/></svg>';
function lastMvp(){var m=D.history&&D.history[0];return m&&m.mvp||null}
function avHtml(id,p,big){p=p||P(id)||{};var s=isG(id)?'c':(p.avs||'c');var h='<div class="avatar av-'+s+(big?' big':'')+'" style="background:'+esc(p.color||(isG(id)?'#8d9ac0':COLORS[0]))+';color:#07101f">'+avInner(id,p)+'</div>';return (id&&id===lastMvp())?'<span class="avw'+(big?' big':'')+'">'+h+CROWN+'</span>':h}
function curId(){return D.cur?D.cur.id:null}
function rsvpOf(id){if(isG(id))return guestList().some(function(g){return g.id===id})?'yes':null;var r=D.rsvps[id];return r&&r.matchId===curId()?r.v:null}
function offList(){return D.cur&&D.cur.official||[]}
function outList(){var o=[];Object.keys(D.rsvps).forEach(function(id){var q=D.rsvps[id];if(q&&q.matchId===curId()&&q.out)o.push(id)});return o}
function isOff(id){return lineup().indexOf(id)>=0}
function allIds(){return Object.keys(D.players).sort(function(a,b){return pname(a).localeCompare(pname(b),'it')})}
function yesIds(){return allIds().filter(function(id){return rsvpOf(id)==='yes'}).concat(guestList().map(function(g){return g.id}))}
function lvl(id){if(isG(id)){var gg=P(id);return {v:(gg&&gg.lv)||3,n:1}}var d=D.levels[id]||{},s=0,n=0;Object.keys(d).forEach(function(k){if(k.indexOf('r_')===0&&k!=='r_'+id&&typeof d[k]==='number'){s+=d[k];n++}});return {v:n?s/n:3,n:n}}
function cnt(L,x){var t=0;L.forEach(function(id){var q=roles(id);if(q[0]===x)t+=1;else if(q[1]===x)t+=0.5});return t}
function cntP(L,x){return L.filter(function(id){return roles(id)[0]===x}).length}
function fw(n){return String(n).replace('.',',')}
function yesOrdered(){return yesIds().sort(function(a,b){var x=atOf(a)-atOf(b);return x||(a<b?-1:1)})}
function lineup(){
  if(D.cur&&D.cur.official){
    var out=outList(),L=offList().filter(function(id){return P(id)&&out.indexOf(id)<0});
    if(L.length<need())yesOrdered().forEach(function(id){if(L.length<need()&&L.indexOf(id)<0&&out.indexOf(id)<0)L.push(id)});
    return L;
  }
  return yesOrdered().slice(0,need());
}
function queueIds(){var L=lineup();return yesOrdered().filter(function(id){return L.indexOf(id)<0&&outList().indexOf(id)<0})}
function avg(L){return L.length?L.reduce(function(s,id){return s+lvl(id).v},0)/L.length:0}
function dots(v){var h='<span class="dots" aria-label="livello '+v.toFixed(1)+' su 5">';for(var i=1;i<=5;i++)h+='<i class="'+(v>=i-0.25?'f':'')+'"></i>';return h+'</span>'}
function np(n,x,y){return n+' '+(n===1?x:y)}

/* statistiche dalla storia delle partite */
function stats(){
  var st={};
  allIds().forEach(function(id){st[id]={pl:0,g:0,a:0,mvp:0,fg:(D.players[id].forfeits||0)}});
  D.history.forEach(function(m){
    (m.teamA||[]).concat(m.teamB||[]).forEach(function(id){if(st[id])st[id].pl++});
    Object.keys(m.goals||{}).forEach(function(id){if(st[id])st[id].g+=m.goals[id]});
    Object.keys(m.assists||{}).forEach(function(id){if(st[id])st[id].a+=m.assists[id]});
    if(m.mvp&&st[m.mvp])st[m.mvp].mvp++;
  });
  return st;
}

/* sorteggio equilibrato per livello e ruoli */
function combos(n,k){var out=[],c=[];(function go(s){if(c.length===k){out.push(c.slice());return}for(var i=s;i<n;i++){c.push(i);go(i+1);c.pop()}})(0);return out}
function makeTeams(avoid){
  var pl=lineup();if(pl.length<2)return null;
  var k=Math.floor(pl.length/2),all=[];
  combos(pl.length,k).forEach(function(c){
    if(pl.length%2===0&&c.indexOf(0)<0)return;
    var A=c.map(function(i){return pl[i]}),B=pl.filter(function(_,i){return c.indexOf(i)<0});
    var pen=0;
    RL.forEach(function(x){var a=cnt(A,x),b=cnt(B,x);pen+=0.08*Math.abs(a-b);if(a+b>=1.5&&(a===0||b===0))pen+=x==='Porta'?0.25:0.12});
    all.push({A:A,B:B,s:Math.abs(avg(A)-avg(B))+pen,key:A.slice().sort().join()});
  });
  all.sort(function(x,y){return x.s-y.s});
  var pool=all.filter(function(t){return t.key!==avoid}).slice(0,6);
  var pick=pool[Math.floor(Math.random()*pool.length)]||all[0];
  return {A:pick.A,B:pick.B,diff:Math.abs(avg(pick.A)-avg(pick.B)),key:pick.key};
}
function yesKey(){return lineup().join('|')}
function teamsReady(){return D.cur&&D.cur.teamA&&D.cur.teamA.length>0}
function genTeams(){
  if(!ADMIN){toast('Solo l\'admin può farlo');return}
  if(lineup().length<2){toast('Servono almeno due giocatori in formazione');return}
  var prev=D.cur&&D.cur.teamA?D.cur.teamA.slice().sort().join():null;
  var t=makeTeams(prev);
  upd('matches/current',{teamA:t.A,teamB:t.B,diff:t.diff,teamsKey:yesKey()});
}


/* serie di presenze e coppie */
function extra(){
  var streak={},pairs={};
  allIds().forEach(function(id){var n=0;for(var i=0;i<D.history.length;i++){var m=D.history[i];if((m.teamA||[]).indexOf(id)>=0||(m.teamB||[]).indexOf(id)>=0)n++;else break}streak[id]=n});
  D.history.forEach(function(m){
    var sa=m.sa||0,sb=m.sb||0;
    [[m.teamA||[],sa>sb?1:sa<sb?0:.5],[m.teamB||[],sb>sa?1:sb<sa?0:.5]].forEach(function(t){
      var T=t[0].filter(function(id){return D.players[id]}).sort();
      for(var i=0;i<T.length;i++)for(var j=i+1;j<T.length;j++){
        var k=T[i]+'|'+T[j],p=pairs[k]||(pairs[k]={a:T[i],b:T[j],n:0,w:0,pts:0});
        p.n++;p.pts+=t[1];if(t[1]===1)p.w++;
      }
    });
  });
  var wins={};D.history.forEach(function(m){var sa=m.sa||0,sb=m.sb||0,w=sa>sb?m.teamA:sb>sa?m.teamB:[];(w||[]).forEach(function(id){if(D.players[id])wins[id]=(wins[id]||0)+1})});
  return {wins:wins,streak:streak,pairs:Object.keys(pairs).map(function(k){return pairs[k]})};
}

function awardsList(){
  var st=stats(),ex=extra(),ids=allIds(),out=[];
  function best(f,min){var b=null,bv=-1;ids.forEach(function(id){var v=f(id);if(v>=min&&v>bv){bv=v;b=id}});return b?{id:b,v:bv}:null}
  var x;
  if(x=best(function(id){return st[id].g},1))out.push({l:'Capocannoniere',n:pname(x.id),d:x.v+' gol'});
  if(x=best(function(id){return st[id].a},1))out.push({l:'Re degli assist',n:pname(x.id),d:np(x.v,'assist','assist')});
  if(x=best(function(id){return st[id].mvp},1))out.push({l:'MVP della stagione',n:pname(x.id),d:np(x.v,'premio','premi')});
  if(x=best(function(id){return st[id].pl},1))out.push({l:'Più presente',n:pname(x.id),d:np(x.v,'partita','partite')});
  if(x=best(function(id){return ex.wins[id]||0},1))out.push({l:'Più vittorie',n:pname(x.id),d:np(x.v,'vittoria','vittorie')});
  if(x=best(function(id){return st[id].pl>=2?st[id].g/st[id].pl:0},0.01))out.push({l:'Miglior media gol',n:pname(x.id),d:x.v.toFixed(1)+' a partita'});
  if(x=best(function(id){return ex.streak[id]},2))out.push({l:'Serie in corso',n:pname(x.id),d:x.v+' partite di fila'});
  var pr=ex.pairs.filter(function(p){return p.n>=2}).sort(function(a,b){return b.pts/b.n-a.pts/a.n||b.n-a.n})[0];
  if(pr)out.push({l:'Coppia d\'oro',n:pname(pr.a)+' + '+pname(pr.b),d:pr.w+' vittorie su '+pr.n});
  if(x=best(function(id){return st[id].fg},1))out.push({l:'Re dei forfait',n:pname(x.id),d:np(x.v,'forfait','forfait')});
  return out;
}

/* formazione tipo e record, dalla storia delle partite */
function playerLog(){
  var L={};allIds().forEach(function(id){if(!isG(id))L[id]={pl:0,g:0,a:0,mvp:0,w:0,cs:0}});
  D.history.forEach(function(m){
    var sa=m.sa||0,sb=m.sb||0;
    [[m.teamA||[],sa,sb],[m.teamB||[],sb,sa]].forEach(function(t){t[0].forEach(function(id){var l=L[id];if(!l)return;l.pl++;if(t[1]>t[2])l.w++;if(t[2]===0)l.cs++})});
    Object.keys(m.goals||{}).forEach(function(id){if(L[id])L[id].g+=m.goals[id]});
    Object.keys(m.assists||{}).forEach(function(id){if(L[id])L[id].a+=m.assists[id]});
    if(m.mvp&&L[m.mvp])L[m.mvp].mvp++;
  });
  return L;
}

function recordsHtml(){
  if(!D.history.length)return '<div class="empty">Ancora nessuna partita. I record compaiono dopo la prima.</div>';
  var H=D.history,cards=[];
  function card(l,v,d){cards.push('<div class="award"><div class="label">'+esc(l)+'</div><div class="v">'+v+'</div><div class="d">'+d+'</div></div>')}

  card('Partita con più gol',mt.t+' gol',mdesc(mt.m));
  card('Vittoria più larga',mw?'+'+mw.w:'—',mw?mdesc(mw.m):'nessuna vittoria');
  function holders(map,min){var mx=0,hs=[];Object.keys(map).forEach(function(id){if(map[id]>mx){mx=map[id];hs=[id]}else if(map[id]===mx&&mx>0)hs.push(id)});return mx>=(min||1)?{v:mx,h:hs}:null}

    for(var i=H.length-1;i>=0;i--){var m=H[i],inA=(m.teamA||[]).indexOf(id)>=0,inB=(m.teamB||[]).indexOf(id)>=0;
      if(!inA&&!inB){run=0;wr=0;continue}
      run++;if(run>bs[id])bs[id]=run;
      var my=inA?(m.sa||0):(m.sb||0),op=inA?(m.sb||0):(m.sa||0);

      if(((m.goals||{})[id]||0)>mg[id])mg[id]=m.goals[id];

    }
  });
  var r;

  r=holders(ma);card('Più assist in una partita',r?r.v+(r.v===1?' assist':' assist'):'—',r?names(r.h):'nessun dato');

  return '<div class="awards">'+cards.join('')+'</div>';
}

  var F=[

var FX=[];

function ring(el,col){A(el,[{boxShadow:'0 0 0 0 '+col,opacity:1},{boxShadow:'0 0 0 18px rgba(0,0,0,0)',opacity:1}],{duration:650,easing:'ease-out'})}

function fxRun(){
  var calm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;

    if(D.cur.official){toast('Riapri la formazione per cambiare formato');return}
    var nf=v==='calciotto'?'calciotto':'calcetto';
    if((D.cur.format==='calciotto')!==(nf==='calciotto')){upd('matches/current',{format:nf});fxOn({ok:function(){return (D.cur.format==='calciotto')===(nf==='calciotto')},run:function(){var b=$1('[data-a="fmt"][data-v="'+nf+'"]');pop(b,1.08);ring(b,tok('--green'));pop($1('.count'),1.3);var bi=$1('.bar i');if(bi)A(bi,[{width:'0%'},{width:bi.style.width}],{duration:650,easing:'cubic-bezier(.2,.9,.2,1)'})}})}
  }
  else if(a==='grole'){S.gr=v}
  else if(a==='glv'){S.gl=+v}
  else if(a==='gadd'){
    if(!ADMIN)return;
    var gn=cleanName(S.gname).slice(0,14);
    if(!gn){toast('Scrivi il nome dell\'ospite');return}
    if(guestList().length>=8){toast('Massimo otto ospiti');return}
    var gid='g_'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),gl=guestList().concat([{id:gid,nick:gn,lv:S.gl,roles:[S.gr],at:Date.now()}]);
    S.gname='';
    fxOn({ok:function(){return guestList().some(function(g){return g.id===gid})},run:function(){var r=$1('.row[data-id="'+gid+'"]');flash(r,tok('--green'));pop($1('.count'),1.3)}});
    upd('matches/current',{guests:gl});toast(gn+' aggiunto come ospite');
  }
  else if(a==='grm'){
    if(!ADMIN)return;
    upd('matches/current',{guests:guestList().filter(function(g){return g.id!==id})});
  }
  else if(a==='editres'){
    if(!ADMIN)return;
    var em=D.history.filter(function(x){return x._id===id})[0];
    if(!em){toast('Partita non trovata');return}
    S.res={sa:em.sa||0,sb:em.sb||0,goals:JSON.parse(JSON.stringify(em.goals||{})),assists:JSON.parse(JSON.stringify(em.assists||{})),mvp:em.mvp||null,forMatch:em._id};
    S.corr=em._id;S.tab='risultato';window.scrollTo(0,0);
  }
  else if(a==='corrno'){S.corr=null}
  else if(a==='tcol'){var tk=el.dataset.t,nc=TCOLS[+v][0],ok=tk==='A'?'B':'A',oc={};if(!D.cur)return;if(tcol(D.cur,ok)===nc){toast('È già il colore dell\'altra squadra');return}oc['color'+tk]=nc;upd('matches/current',oc)}
  else if(a==='tro'){openTrophies();return}
  else if(a==='awimg'){mkAwImg();return}
  else if(a==='mode'){
    if(v==='light')document.documentElement.setAttribute('data-mode','light');else document.documentElement.removeAttribute('data-mode');
    try{localStorage.setItem('forfait-mode',v)}catch(e){}
  }
  else if(a==='help'){S.help=!S.help;if(S.help)fxOn({run:function(){reveal($1('.help'));cascade(qa('.help .note'),60,8)}})}
  else if(a==='why'){S.why=!S.why;if(S.why)fxOn({run:function(){reveal($1('.why'));cascade(qa('.why li'),55,8)}})}
  else if(a==='copy'){copyRem();return}
  else if(a==='intro'){if(window.showIntro)window.showIntro(true);return}
  else if(a==='share'){shareNow();var sb=$1('[data-a="share"]');if(sb)pop(sb,1.25);return}
  else if(a==='hist'){S.openH=S.openH===id?null:id;if(S.openH===id)fxOn({run:function(){reveal($1('.hdet'))}})}
  else if(a==='img'){mkImg(id);return}
  else if(a==='imgx'){S.img=null}
  else if(a==='imgsave'){saveImg();return}
  else if(a==='fg'){
    if(!ADMIN)return;
    var pp=D.players[id];
    if(pp){var f0=pp.forfeits||0,nv=Math.max(0,f0+d);if(nv!==f0){upd('players/'+id,{forfeits:nv});fxOn({ok:function(){return (D.players[id]||{}).forfeits===nv},run:function(){pop($1('[data-fgn="'+id+'"]'),1.6)}})}}
  }
  else if(a==='rm'){S.rm=id}
  else if(a==='rmno'){S.rm=null}
  else if(a==='rmyes'){
    S.rm=null;
    if(!ADMIN)return;
    if(id===UID){toast('Non puoi rimuovere te stesso')}
    else{var nm=pname(id);del('players/'+id);if(D.rsvps[id])del('rsvps/'+id);if(D.levels[id])del('levels/'+id);toast(nm+' rimosso dal gruppo')}
  }
  else if(a==='reopen'){S.confirmRe=true;fxOn({run:function(){reveal($1('.panel .banner'))}})}
  else if(a==='reopenno'){S.confirmRe=false}
  else if(a==='reopenyes'){S.confirmRe=false;upd('matches/current',{official:null}).then(function(){toast('Formazione riaperta')})}
  else if(a==='pick'){
    if(!ADMIN)return;
    var cA=(D.cur.teamA||[]).slice(),cB=(D.cur.teamB||[]).slice();
    if(!S.pick||S.pick===id){S.pick=S.pick===id?null:id}
    else{
      var sameA=cA.indexOf(S.pick)>=0&&cA.indexOf(id)>=0,sameB=cB.indexOf(S.pick)>=0&&cB.indexOf(id)>=0;
      if(sameA||sameB){S.pick=id}
      else{
        var x1=S.pick,x2=id,ia=cA.indexOf(x1)>=0?x1:x2,ib=ia===x1?x2:x1;
        cA[cA.indexOf(ia)]=ib;cB[cB.indexOf(ib)]=ia;
        S.pick=null;
        var key0=JSON.stringify(D.cur.teamA);
        fxOn({ok:function(){return JSON.stringify(D.cur.teamA)!==key0},run:function(){[ia,ib].forEach(function(z){var l=$1('.team li[data-id="'+z+'"]');pop(l,1.08);flash(l,tok('--green'))});pop($1('.balance b'),1.2)}});
        upd('matches/current',{teamA:cA,teamB:cB,diff:Math.abs(avg(cA)-avg(cB))});
        toast('Giocatori scambiati');
      }
    }
  }
  else if(a==='editm'){S.editM=!S.editM;if(S.editM)fxOn({run:function(){var f=$1('#mdate');if(f){reveal(f.closest('div'));cascade(qa('#mdate,#mtime,#mfield').map(function(x){return x.closest('label')}),70,10)}}})}
  else if(a==='role1'){var q=(m.roles||[]).slice(),o=q[1];q=[v];if(o&&o!==v)q.push(o);setP({roles:q});fxOn({run:function(){var b=$1('[data-a="role1"][data-v="'+v+'"]');pop(b,1.25);ring(b,tok('--green'));pop($1('.shirt'),1.08)}})}
  else if(a==='role2'){var q2=(m.roles||[]).slice(0,1);if(q2[0]===v)return;if((m.roles||[])[1]===v){setP({roles:q2});pop($1('[data-a="role2"][data-v="'+v+'"]'),.8)}else{q2.push(v);setP({roles:q2});fxOn({run:function(){var b=$1('[data-a="role2"][data-v="'+v+'"]');pop(b,1.25);ring(b,tok('--green'));pop($1('.shirt'),1.08)}})}}
  else if(a==='foot'){setP({foot:v});fxOn({ok:function(){return (me()||S.draft).foot===v},run:function(){var b=$1('[data-a="foot"][data-v="'+v+'"]');pop(b,1.22);ring(b,tok('--green'))}})}
  else if(a==='color'){setP({color:COLORS[+v]});fxOn({ok:function(){return (me()||S.draft).color===COLORS[+v]},run:function(){var b=$1('[data-a="color"][data-v="'+v+'"]');pop(b,1.4);ring(b,COLORS[+v]);var sh=$1('.shirt');pop(sh,1.15);ring(sh,COLORS[+v])}})}
  else if(a==='avc'){setP({avc:v});fxOn({ok:function(){return (me()||S.draft).avc===v},run:function(){var b=$1('[data-a="avc"][data-v="'+v+'"]');pop(b,1.2);ring(b,tok('--green'));var x=$1('.fig .avatar');pop(x,1.3);ring(x,tok('--green'))}})}
  else if(a==='avi'){var ic=AVI[+v];setP({avi:ic,avc:'e'});fxOn({ok:function(){return (me()||S.draft).avi===ic},run:function(){var b=$1('[data-a="avi"][data-v="'+v+'"]');pop(b,1.35);var x=$1('.fig .avatar');pop(x,1.3);ring(x,tok('--green'))}})}
  else if(a==='avs'){setP({avs:v});fxOn({ok:function(){return (me()||S.draft).avs===v},run:function(){var b=$1('[data-a="avs"][data-v="'+v+'"]');pop(b,1.2);ring(b,tok('--green'));var x=$1('.fig .avatar');pop(x,1.3)}})}
  else if(a==='join'){
    var dr=S.draft,nick=(dr.nick||'').trim();
    if(!nick){toast('Scrivi il tuo nome');return}
    setDoc('players/'+UID,{nick:nick,aka:dr.aka||'',motto:dr.motto||'',num:dr.num,roles:dr.roles,foot:dr.foot,color:dr.color,avc:dr.avc||'i',avi:dr.avi||AVI[0],avs:dr.avs||'c',forfeits:0}).then(function(){S.tab='partita';fxOn({run:function(){cascade(qa('#screen .panel'),90,22)}});toast('Benvenuto, '+nick)});
  }
  render();
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='gname')S.gname=el.value.slice(0,14).replace(/[<>&"]/g,'');
  if(el.id==='aka'||el.id==='motto'){var v0=el.value,wd=v0.split(/\s+/).filter(Boolean).length,mx=LIM[el.id][0],pv=el.dataset.pv,lv;
    if(wd>mx)lv=(pv!==undefined&&v0.length-pv.length<=1)?pv:limField(el.id,v0);else lv=limField(el.id,v0);
    if(lv!==el.value)el.value=lv;el.dataset.pv=lv;if(!me())S.draft[el.id]=lv}
  if(!me()){
    if(el.id==='nick')S.draft.nick=el.value.replace(/[<>&"]/g,'').slice(0,14);
    if(el.id==='num'){var n=parseInt(el.value,10);if(n>=1&&n<=99)S.draft.num=n}
  }
});
document.addEventListener('change',function(e){
  var el=e.target,id=el.id;
  if(id==='nick'&&me()){var nv=el.value.replace(/[<>&"]/g,'').trim().slice(0,14);if(nv)upd('players/'+UID,{nick:nv})}
  else if((id==='aka'||id==='motto')&&me()){var av=limField(id,el.value).trim(),ao={};ao[id]=av;upd('players/'+UID,ao)}
  else if(id==='num'&&me()){var n=parseInt(el.value,10);if(n>=1&&n<=99)upd('players/'+UID,{num:n})}
  else if(id==='mdate'&&el.value)upd('matches/current',{date:el.value});
  else if((id==='nameA'||id==='nameB')&&ADMIN){var nn=cleanName(el.value),o={};if(nn){o[id]=nn;upd('matches/current',o)}else el.value=tn(D.cur,id.slice(4))}
  else if(id==='mtime')upd('matches/current',{time:el.value});
  else if(id==='mfield')upd('matches/current',{field:el.value.replace(/[<>&"]/g,'').trim().slice(0,60)});
});
document.addEventListener('focusout',function(){setTimeout(function(){var a=document.activeElement;if(S.dirty&&!(a&&a.tagName==='INPUT'))render()},0)});

/* collegamento ai dati */
function toMap(s){var o={};s.docs.forEach(function(d){o[d.id]=d.data()});return o}
function sub(path,fn){DB.collection(path).onSnapshot(function(s){fn(s);changed()},function(e){S.err=e&&e.code||'err';changed()})}
async function init(){
  render();
  var use=window.claude&&window.claude.use?function(n){return window.claude.use(n)}:function(){return Promise.resolve(null)};
  var user=await use('user');DB=await use('db');
  if(user){
    var v=await user.me();UID=v.id;MYNAME=(v.name||'').split(' ')[0].slice(0,14);
    var cw=await user.can('data.write');CANWRITE=cw!==false;ADMIN=await user.canEdit();
  }
  S.draft.nick=MYNAME;
  if(!DB||!UID){DB=null;S.err='nodb';S.ready=true;render();return}
  sub('players',function(s){D.players=toMap(s)});
  sub('rsvps',function(s){D.rsvps=toMap(s)});
  sub('levels',function(s){D.levels=toMap(s)});
  sub('mvpvotes',function(s){D.mvpv=toMap(s)});
  sub('history',function(s){D.history=s.docs.map(function(d){var x=d.data();x._id=d.id;return x}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')})});
  DB.doc('matches/current').onSnapshot(function(s){D.cur=s.exists?s.data():null;changed()},function(e){S.err=e&&e.code||'err';changed()});
}
init();
})();
</script>
</html>
